services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meghsetu-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_PROVIDER=operational
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meghsetu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
